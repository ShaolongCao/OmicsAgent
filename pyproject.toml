[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omicsagent"
version = "0.3.0"
description = "Auditable single-cell and spatial transcriptomics workflows with bounded Claude tool use"
requires-python = ">=3.11,<3.14"
dependencies = [
  "scanpy>=1.11,<1.12", "anndata>=0.11,<0.13", "numpy>=1.26,<3",
  "pandas>=2.2,<3", "scipy>=1.12,<2", "scikit-learn>=1.5,<2",
  "igraph>=0.11,<0.12", "pydantic>=2.8,<3", "matplotlib>=3.8,<4",
  "httpx>=0.27,<1", "nbformat>=5.10,<6", "anthropic>=0.40,<1",
]

[project.optional-dependencies]
hierarchy = ["harmonypy==0.0.10"]
scanvi = ["scvi-tools>=1.3,<1.4"]
tacco = ["tacco>=0.5,<0.6"]
dev = ["pytest>=8,<10", "ruff>=0.9", "mypy>=1.13", "nbclient>=0.10", "ipykernel>=6", "build>=1"]

[project.scripts]
omicsagent = "omicsagent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/omicsagent"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/examples", "/scripts", "/docs", "/README.md", "/pyproject.toml", "/uv.lock", "/.github", "/.gitignore"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["omicsagent.config", "omicsagent.trace"]
strict = true
