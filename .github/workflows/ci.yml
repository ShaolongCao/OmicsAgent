name: checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    env:
      MPLBACKEND: Agg
      NUMBA_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --frozen --extra dev --extra hierarchy
      - run: uv run --no-sync ruff check src tests scripts
      - run: uv run --no-sync mypy src/omicsagent
      - run: uv run --no-sync pytest -q
      - run: uv run --no-sync python scripts/export_release.py --out /tmp/omicsagent-release-check
